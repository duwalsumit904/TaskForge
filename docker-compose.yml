services:
  db:
    image: postgres:18
    container_name: taskforge-db
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge_dev_password
      POSTGRES_DB: taskforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: