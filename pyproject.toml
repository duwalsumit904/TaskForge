[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
extend-exclude = ["migrations"]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "UP",  # modern Python syntax
    "B",   # likely bugs
]